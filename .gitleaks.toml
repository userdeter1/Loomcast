# Gitleaks configuration for Loomcast
title = "Loomcast Gitleaks Configuration"

[allowlist]
description = "Global allowlist excluding false positives in docs, tests and static data"

# Path exclusions:
# - docs/ : contains TOML configuration examples and environment variable descriptions
# - tests/ : contains mocks, fixtures and test digests
# - loomcast/adapters/catalog/data/catalog.json : static catalog with sha256 hashes and digests
paths = [
    '''docs/.*''',
    '''tests/.*''',
    '''loomcast/adapters/catalog/data/catalog.json'''
]

# Allowed regex patterns (environment variables and documentation placeholders):
# - CI secret variable names (TEST_PYPI_API_TOKEN, PYPI_API_TOKEN)
# - Generic placeholders in the documentation (e.g. YOUR_API_KEY, fake_token)
regexes = [
    '''TEST_PYPI_API_TOKEN''',
    '''PYPI_API_TOKEN''',
    '''YOUR_API_KEY''',
    '''fake_[a-zA-Z0-9_]+'''
]
