[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "loomcast"
version = "0.2.0"
description = "Python SDK and CLI for seamlessly managing local LLM runtimes (Ollama, LM Studio, llama.cpp)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Loomcast Contributors" }
]
keywords = ["llm", "ollama", "lmstudio", "llamacpp", "ai", "sdk", "cli", "local-ai"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "typer>=0.9.0",
    "pydantic>=2.0.0",
    "httpx>=0.24.0",
    "platformdirs>=3.0.0",
    "rich>=13.0.0",
    "tomli-w>=1.0.0",
    'tomli>=2.0.0; python_version < "3.11"',
    'typing-extensions>=4.5.0; python_version < "3.11"',
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-mock>=3.10.0",
    "ruff==0.16.4",
    "build>=1.0.0",
    "pre-commit>=3.0.0",
]

[project.urls]
Homepage = "https://github.com/userdeter1/Loomcast"
Repository = "https://github.com/userdeter1/Loomcast"
Issues = "https://github.com/userdeter1/Loomcast/issues"
Changelog = "https://github.com/userdeter1/Loomcast/blob/main/CHANGELOG.md"

[project.scripts]
loomcast = "loomcast.cli.main:app"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["loomcast*"]

[tool.setuptools.package-data]
loomcast = ["adapters/catalog/data/*.json", "adapters/catalog/data/*.sha256"]

[tool.pytest.ini_options]
pythonpath = "."
testpaths = ["tests"]
python_files = ["test_*.py"]
markers = [
    "integration: tests requiring a real local runtime server (deselected by default)"
]
addopts = "-m 'not integration'"

[tool.coverage.run]
source = ["loomcast"]
omit = [
    "tests/integration/*",
    "scripts/*",
]

[tool.coverage.report]
fail_under = 80
show_missing = true

[tool.ruff]
target-version = "py39"
line-length = 88

[tool.ruff.lint]
# `select` must stay explicit: with only `ignore` set, ruff falls back to its
# built-in default rule set, which changes between releases. That is what broke
# CI when ruff 0.16.0 shipped a wider default than the 0.15.x used locally.
# Ruff's historical defaults, plus import sorting (I), pycodestyle warnings (W)
# and bugbear (B) -- B904 in particular keeps exception chaining explicit.
# E501 is intentionally omitted: ruff-format owns line wrapping and cannot split
# long string literals, so E501 would only flag lines it will not fix.
select = ["E4", "E7", "E9", "F", "I", "W", "B"]
ignore = ["UP045"]
